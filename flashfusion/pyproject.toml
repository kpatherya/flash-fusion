[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashfusion"
version = "0.1.0"
description = "Flash-Fusion: Expressive, low-latency natural language queries over IoT sensor streams"
requires-python = ">=3.12"
dependencies = [
    "langchain-openrouter>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-classic>=1.0.0",
    "langchain-experimental>=0.3.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.9.0",
    "snowballstemmer>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
# flashfusion/ lives inside flash-fusion/ repo root.
# pip install -e flashfusion/ from repo root installs the flashfusion package.
where = [".."]
include = ["flashfusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
