name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-shell-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check benchmark shell syntax
        run: bash -n run_benchmark.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./flashfusion --no-deps

      - name: Run deterministic router smoke tests
        run: python -m pytest flashfusion/tests/test_operator_router.py -q

      - name: Try full test collection (non-blocking fallback)
        run: |
          if python -m pytest flashfusion/tests --collect-only -q; then
            echo "Full test collection succeeded."
          else
            echo "::warning::Full test collection failed in lightweight CI; router smoke gate still passed."
          fi
